  <script>
    const DEDICATION = {
      recipient: "Penelope",                   // Recipient's name

      photoCaption: "I love you",             // Text below the circular photo
      footerMessage: "With you, always. ♡",   // Bottom-left message

      secondsPerPage: 6.8,                   // Automatic slide duration
      autoplay: true,                       // true = advance slides automatically
      pauseOnNavigation: false,              // true = using arrows pauses autoplay

      // Each object represents ONE SLIDE. Add, delete, or reorder freely.
      // Optional "photo": use a different image, e.g. "photos/second.jpg".
      // Optional "photoCaption": different text below this slide's photo.
      // Optional "photoPosition": crop position, e.g. "50% 30%".
      // Optional "photoRotation": rotation in degrees, e.g. 0, 90, 180.
      pages: [
        {
          line1: "I",
          line2: "love you.",
          text: "For you, Penelope. I wanted to give you something special. ♡"
        },
        {
          line1: "My",
          line2: "person.",
          text: "I treasure every moment we share."
        },
        {
          line1: "Your",
          line2: "smile.",
          text: "You make even the simplest days feel beautiful."
        },
        {
          line1: "You're",
          line2: "special.",
          text: "There are so many lovely things I want to tell you."
        },
        {
          line1: "Always",
          line2: "with you.",

      ]

  <style>
    :root {

    .arrow-button:hover { transform: translateX(-3px); background: #fff8fb; }
    .arrow-button.next { background: var(--ink); border-color: var(--ink); color: #fff5f9; }
    .arrow-button.next:hover { transform: translateX(3px); background: #a14969; }
    .arrow-button:active { transform: scale(.94); }

    .steps::-webkit-scrollbar { display: none; }
    .step { position: relative; display: grid; flex: 0 0 30px; align-items: center; width: 30px; height: 44px; border: 0; padding: 0; background: transparent; }
    .step-track { display: block; height: 3px; width: 100%; overflow: hidden; border-radius: 3px; background: #e6b7ca; transition: background .3s; }
    .step-fill { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--ink); transform: scaleX(0); transform-origin: left; }
    .step[aria-current="true"] .step-track { background: #cf779a; }

    .love-toast { position: fixed; left: 50%; bottom: max(110px, env(safe-area-inset-bottom)); z-index: 11; width: max-content; max-width: calc(100vw - 48px); margin: 0; padding: 13px 23px; border: 1px solid #df9fbb; border-radius: 999px; background: #fff5fa; color: var(--ink); box-shadow: 0 8px 30px #97406118; font: italic 20px Georgia, serif; opacity: 0; transform: translate(-50%, 12px); transition: opacity .25s, transform .4s var(--ease); pointer-events: none; }
    .love-toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .is-paused .ambience *, .is-paused .portrait-wrap, .is-paused .portrait-orbit, .is-paused .portrait::before, .is-paused .heart-seal, .is-paused .portrait-spark, .is-paused .little-hearts .icon,
    .is-hidden .ambience *, .is-hidden .portrait-wrap, .is-hidden .portrait-orbit, .is-hidden .portrait::before, .is-hidden .heart-seal, .is-hidden .portrait-spark, .is-hidden .little-hearts .icon { animation-play-state: paused; }
    @keyframes float-up {
      0% { transform: translate3d(0, 108vh, 0) rotate(-15deg); opacity: 0; }

      50% { transform: translate3d(var(--drift), 44vh, 0) rotate(12deg); }
      88% { opacity: var(--opacity); }
      100% { transform: translate3d(0, -12vh, 0) rotate(-8deg); opacity: 0; }
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes portrait-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes heartbeat { 0%, 25%, 45%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 35% { transform: scale(1.055); } }
    @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: .85; transform: scale(1.1); } }
    @keyframes breathe { to { transform: translate(5%, 5%) scale(1.15); opacity: .5; } }
    @keyframes love-burst { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 15% { opacity: .85; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--turn)) scale(var(--scale)); } }

      .portrait-column { margin-bottom: 65px; }
      .portrait-wrap { width: clamp(172px, 49vw, 230px); }
      .portrait-orbit { inset: -17px; }
      .photo-window { inset: 4px; border-width: 4px; }
      .portrait { box-shadow: 0 0 0 8px #fff8fb70, 0 18px 50px #ad4c6f21; }
      .heart-seal { width: 43px; height: 43px; border-width: 4px; right: 2px; bottom: 3px; }
      .heart-seal .icon { width: 19px; height: 19px; }
      .portrait-caption { display: block; top: calc(100% + 20px); font-size: 17px; }

      .eyebrow { justify-content: center; margin-bottom: 14px; font-size: 12px; letter-spacing: .17em; }

      h1.long-title { font-size: clamp(2.9rem, 12.5vw, 4.25rem); }

  </style>
</head>
<body>
  <svg class="symbol-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 22l7.78-8.55 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></symbol>

  <div class="ambience" aria-hidden="true">

  </div>
  <div class="page-frame" aria-hidden="true"></div>
  <div class="app">
    <header class="masthead">
      <div class="dedication"><svg class="icon" aria-hidden="true"><use href="#heart"/></svg><span id="brand">By Jan</span></div>
      <button type="button" id="motion-button" class="motion-button js-control" aria-label="Pause the slideshow and animations">

  <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  <script>
    (() => {
      'use strict';

      // This code uses the settings in DEDICATION above.
      // To customize the page, only edit the configuration block at the top.
      const cfg = DEDICATION;
      const pages = Array.isArray(cfg.pages) && cfg.pages.length
        ? cfg.pages
        : [{ line1: 'I', line2: 'love you.', text: '♡' }];
      const DURATION = Math.max(2, Number(cfg.secondsPerPage) || 6.8) * 1000;
      const $ = (id) => document.getElementById(id);
      const body = document.body;
      const stage = $('presentation');
      const copy = $('story-copy');
      const image = $('slide-photo');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const placeholder = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">' +
        '<defs><radialGradient id="g"><stop stop-color="#fff8fb"/><stop offset="1" stop-color="#f5bfd2"/></radialGradient></defs>' +
        '<rect width="600" height="600" fill="url(#g)"/>' +
        '<circle cx="300" cy="300" r="245" fill="none" stroke="#e7a3bd" stroke-width="2" stroke-dasharray="8 14"/>' +
        '<path d="M300 425 165 290c-79-88 56-203 135-98 79-105 214 10 135 98Z" fill="#d4749e" opacity=".73"/>' +
        '<text x="300" y="501" font-family="Georgia,serif" font-size="32" fill="#a34e70" text-anchor="middle">♡</text></svg>'
      );

      let current = 0;
      let elapsed = 0;
      let lastTick = null;
      let frame = null;
      let paused = motionPreference.matches || cfg.autoplay === false;
      let transitionTimer = null;
      let transitioning = false;
      let toastTimer = null;
      let pointerStart = null;
      let swipeHandled = false;
      let lastBurst = 0;

      // Create one navigation indicator for every slide.
      const steps = pages.map((page, index) => {
        const step = document.createElement('button');
        step.type = 'button';
        step.className = 'step';
        step.setAttribute('aria-label', `Go to slide ${index + 1}: ${page.line1 || ''} ${page.line2 || ''}`);
        step.innerHTML = '<span class="step-track"><span class="step-fill"></span></span>';
        $('steps').appendChild(step);
        step.addEventListener('click', () => goTo(index));
        return step;
      });

      function safeText(value, fallback = '') {
        return value === undefined || value === null ? fallback : String(value);
      }

      function applyStaticText() {
        $('brand').textContent = safeText(cfg.signature, 'By Jan');
        $('signature').textContent = safeText(cfg.signature, 'By Jan');
        $('eyebrow').textContent = safeText(cfg.subtitle, 'For ' + cfg.recipient);
        $('footer-note').textContent = safeText(cfg.footerMessage, 'With you, always. ♡');
        $('love-toast').textContent = safeText(cfg.heartMessage, 'I love you, ' + cfg.recipient + ' ♡');
        stage.setAttribute('aria-label', 'A love note for ' + safeText(cfg.recipient));
        $('portrait').setAttribute('aria-label', 'Send a heart to ' + safeText(cfg.recipient));
        $('total').textContent = String(pages.length).padStart(2, '0');
        document.title = safeText(cfg.signature, 'By Jan') + ' ♡';
        document.querySelector('meta[name="description"]').content = 'A little love note for ' + safeText(cfg.recipient) + ', with love. ' + safeText(cfg.signature);
      }

      function updatePhoto(page) {
        const src = safeText(page.photo || cfg.mainPhoto).trim();
        image.style.objectPosition = safeText(page.photoPosition, '50% 50%');
        const degrees = Number(page.photoRotation) || 0;
        image.style.transform = `rotate(${degrees}deg) scale(1.02)`;
        image.alt = 'A photo for ' + safeText(cfg.recipient, 'someone special');
        image.src = src || placeholder;
      }

      image.addEventListener('error', () => {
        if (image.src !== placeholder) image.src = placeholder;
      });

      function renderPage(index) {
        const page = pages[index];
        $('line-one').textContent = safeText(page.line1);
        $('line-two').textContent = safeText(page.line2);
        $('love-note').textContent = safeText(page.text);
        $('photo-caption').textContent = safeText(page.photoCaption, safeText(cfg.photoCaption, 'I love you'));
        $('love-title').classList.toggle('long-title', Boolean(page.longTitle) || (safeText(page.line1) + safeText(page.line2)).length > 17);
        updatePhoto(page);
      }

      function updateControls() {
        steps.forEach((step, index) => {
          if (index === current) step.setAttribute('aria-current', 'true');
          else step.removeAttribute('aria-current');
        });
        steps[current].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        $('previous').disabled = current === 0;
        $('next').setAttribute('aria-label', current === pages.length - 1 ? 'Start again' : 'Next slide');
        $('next-icon').setAttribute('href', current === pages.length - 1 ? '#replay' : '#arrow-right');
        $('counter').textContent = String(current + 1).padStart(2, '0');
        copy.setAttribute('aria-label', `Slide ${current + 1} of ${pages.length}`);
      }

      function tick(timestamp) {
        frame = null;
        if (paused || document.hidden) { lastTick = null; return; }
        if (lastTick !== null && !transitioning) elapsed += Math.min(timestamp - lastTick, 100);
        lastTick = timestamp;
        steps[current].style.setProperty('--progress', String(Math.min(elapsed / DURATION, 1)));
        if (elapsed >= DURATION && !transitioning) goTo((current + 1) % pages.length, false);
        frame = requestAnimationFrame(tick);
      }

      function syncClock() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        lastTick = null;
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      function setPaused(value) {
        paused = Boolean(value);
        body.classList.toggle('is-paused', paused);
        $('motion-icon').setAttribute('href', paused ? '#play' : '#pause');
        $('motion-label').textContent = paused ? 'Play' : 'Pause';
        $('motion-button').setAttribute('aria-label', paused ? 'Play the slideshow and animations' : 'Pause the slideshow and animations');
        syncClock();
      }

      function goTo(index, manual = true) {
        if (index < 0 || index >= pages.length || transitioning) return;
        if (manual && cfg.pauseOnNavigation === true) setPaused(true);
        if (index === current) { elapsed = 0; steps[current].style.setProperty('--progress', '0'); return; }
        transitioning = true;
        copy.classList.add('is-changing');
        transitionTimer = window.setTimeout(() => {
          current = index;
          elapsed = 0;
          renderPage(current);
          steps[current].style.setProperty('--progress', '0');
          updateControls();
          copy.classList.remove('is-changing');
          transitioning = false;
          transitionTimer = null;
          if (manual) {
            const p = pages[current];
            $('announcement').textContent = `Slide ${current + 1} of ${pages.length}. ${safeText(p.line1)} ${safeText(p.line2)}. ${safeText(p.text)}`;
          }
        }, motionPreference.matches ? 0 : 320);
      }

      function sendLove() {
        if (swipeHandled) { swipeHandled = false; return; }
        const now = performance.now();
        if (now - lastBurst < 350) return;
        lastBurst = now;
        window.clearTimeout(toastTimer);
        $('love-toast').classList.add('visible');
        $('announcement').textContent = safeText(cfg.heartMessage);
        toastTimer = window.setTimeout(() => $('love-toast').classList.remove('visible'), 2200);
        if (motionPreference.matches) return;
        const rect = $('portrait').getBoundingClientRect();
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;
        const layer = $('burst-layer');
        for (let i = 0; i < 14; i += 1) {
          const heart = document.createElement('span');
          const angle = (i / 14) * Math.PI * 2;
          const distance = 85 + Math.random() * 115;
          heart.className = 'burst-heart';
          heart.textContent = i % 3 ? '♡' : '♥';
          heart.style.left = `${originX}px`;
          heart.style.top = `${originY}px`;
          heart.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
          heart.style.setProperty('--dy', `${Math.sin(angle) * distance - 65}px`);
          heart.style.setProperty('--turn', `${Math.random() * 70 - 35}deg`);
          heart.style.setProperty('--scale', String(.55 + Math.random() * .7));
          layer.appendChild(heart);
          heart.addEventListener('animationend', () => heart.remove(), { once: true });
          window.setTimeout(() => heart.remove(), 1500);
        }
      }

      function createHearts() {
        if (motionPreference.matches || $('floating-hearts').childElementCount) return;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 22; i += 1) {
          const heart = document.createElement('span');
          heart.className = 'floating-heart';
          heart.textContent = i % 3 === 0 ? '♥' : '♡';
          heart.style.setProperty('--x', `${(i * 47.3) % 100}%`);
          heart.style.setProperty('--size', `${15 + (i * 7) % 27}px`);
          heart.style.setProperty('--duration', `${17 + (i * 3) % 14}s`);
          heart.style.setProperty('--delay', `${-((i * 5.7) % 29)}s`);
          heart.style.setProperty('--drift', `${i % 2 ? 28 : -28}px`);
          heart.style.setProperty('--opacity', String(.16 + (i % 4) * .05));
          heart.style.setProperty('--heart-color', i % 2 ? '#c7799a' : '#d88eae');
          fragment.appendChild(heart);
        }
        $('floating-hearts').appendChild(fragment);
      }

      $('motion-button').addEventListener('click', () => setPaused(!paused));
      $('previous').addEventListener('click', () => goTo(current - 1));
      $('next').addEventListener('click', () => goTo((current + 1) % pages.length));
      $('portrait').addEventListener('click', sendLove);
      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
        if (event.key === 'ArrowRight') { event.preventDefault(); goTo((current + 1) % pages.length); }
        else if (event.key === 'ArrowLeft') { event.preventDefault(); goTo(current - 1); }
        else if (event.key === 'Home') { event.preventDefault(); goTo(0); }
        else if (event.key === 'End') { event.preventDefault(); goTo(pages.length - 1); }
        else if (event.code === 'Space' && !event.target.closest('button, a')) { event.preventDefault(); setPaused(!paused); }
      });
      stage.addEventListener('pointerdown', (event) => {
        if (!event.isPrimary) { pointerStart = null; return; }
        if (event.button !== 0) return;
        swipeHandled = false;
        pointerStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
      });
      window.addEventListener('pointerup', (event) => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
        swipeHandled = true;
        goTo(dx < 0 ? (current + 1) % pages.length : Math.max(0, current - 1));
      });
      window.addEventListener('pointercancel', () => { pointerStart = null; });
      document.addEventListener('visibilitychange', () => {
        body.classList.toggle('is-hidden', document.hidden);
        syncClock();
      });
      motionPreference.addEventListener('change', () => {
        if (motionPreference.matches) setPaused(true);
        else createHearts();
      });
      window.addEventListener('pagehide', () => {
        if (frame !== null) cancelAnimationFrame(frame);
        if (transitionTimer !== null) {
          clearTimeout(transitionTimer);
          copy.classList.remove('is-changing');
          transitioning = false;
        }
        clearTimeout(toastTimer);
        $('love-toast').classList.remove('visible');
        $('burst-layer').replaceChildren();
      });
      window.addEventListener('pageshow', syncClock);

      applyStaticText();
      renderPage(current);
      body.classList.add('has-js');
      createHearts();
      updateControls();
      setPaused(paused);
    })();
  </script>
</body>
</html>
